name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Pruebas de :core y APK de depuracion
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Validar el wrapper de Gradle
        uses: gradle/actions/wrapper-validation@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar el SDK de Android
        run: |
          set -e
          yes | "${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-35" "build-tools;35.0.0" > /dev/null

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Dar permiso de ejecucion al wrapper
        run: chmod +x gradlew

      - name: Pruebas de :core (JVM)
        run: ./gradlew :core:test

      - name: Compilar el APK de depuracion
        run: ./gradlew assembleDebug

      - name: Guardar el APK de depuracion
        uses: actions/upload-artifact@v4
        with:
          name: gmini-android-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
